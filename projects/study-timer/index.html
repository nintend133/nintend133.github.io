<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Gravity Study Timer & Weekly Planner</title>
  <style>
    :root {
      /* 다크 모드 기본 변수 */
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-shadow: rgba(0, 0, 0, 0.5);
      --text-title: #94a3b8;
      --text-main: #f8fafc;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --item-bg: rgba(255, 255, 255, 0.05);
      --item-hover: rgba(255, 255, 255, 0.09);
      --item-active: rgba(56, 189, 248, 0.15);
      --toggle-bg: rgba(255, 255, 255, 0.1);
      --toggle-hover: rgba(255, 255, 255, 0.2);
      --input-bg: rgba(15, 23, 42, 0.6);
    }

    /* 라이트 모드 테마 */
    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: rgba(148, 163, 184, 0.25);
      --text-title: #64748b;
      --text-main: #0f172a;
      --accent-color: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.2);
      --item-bg: rgba(0, 0, 0, 0.03);
      --item-hover: rgba(0, 0, 0, 0.06);
      --item-active: rgba(2, 132, 199, 0.1);
      --toggle-bg: rgba(0, 0, 0, 0.05);
      --toggle-hover: rgba(0, 0, 0, 0.1);
      --input-bg: rgba(255, 255, 255, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 안티그라비티 캔버스 배경 */
    #gravity-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 상단 우측 다크/라이트 모드 토글 버튼 */
    .theme-toggle-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 20;
      background: var(--toggle-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--card-shadow);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.1);
      background: var(--toggle-hover);
    }

    /* 메인 컨테이너 카드 */
    .timer-card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 2rem 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 50px var(--card-shadow);
      width: 460px;
      height: 640px;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 1.1rem;
      color: var(--text-title);
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    /* 탭 메뉴 (타이머 vs 플래너) */
    .tab-container {
      display: flex;
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 1rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-title);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent-color);
      box-shadow: 0 2px 8px var(--card-shadow);
    }

    /* 탭 콘텐츠 영역 */
    .tab-content {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .tab-content.active {
      display: flex;
    }

    /* --- 타이머 탭 스타일 --- */
    .total-header {
      text-align: center;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--card-border);
    }

    .total-time-display {
      font-size: 3rem;
      font-weight: 800;
      font-family: monospace;
      color: var(--accent-color);
      text-shadow: 0 0 20px var(--accent-glow);
      letter-spacing: -1px;
    }

    .total-label {
      font-size: 0.85rem;
      color: var(--text-title);
      margin-top: 0.2rem;
    }

    .subject-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      margin-bottom: 1rem;
    }

    .subject-list::-webkit-scrollbar,
    .todo-list::-webkit-scrollbar {
      width: 6px;
    }
    .subject-list::-webkit-scrollbar-thumb,
    .todo-list::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 10px;
    }

    .subject-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      transition: all 0.2s ease;
    }

    .subject-item:hover {
      background: var(--item-hover);
    }

    .subject-item.active {
      background: var(--item-active);
      border-color: var(--accent-color);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .subject-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      color: white;
      transition: transform 0.2s ease, filter 0.2s ease;
      flex-shrink: 0;
    }

    .play-btn:hover {
      transform: scale(1.08);
      filter: brightness(1.15);
    }

    .subject-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .subject-time {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      opacity: 0.85;
    }

    .subject-item.active .subject-time {
      color: var(--accent-color);
      opacity: 1;
    }

    .action-group {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .btn-add {
      flex: 2;
      padding: 0.75rem;
      background: var(--item-bg);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      color: var(--text-title);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-add:hover {
      background: var(--item-hover);
      color: var(--text-main);
      border-color: var(--accent-color);
    }

    .btn-reset-all {
      flex: 1;
      padding: 0.75rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      color: #ef4444;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset-all:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    /* --- 플래너 탭 스타일 --- */

    /* 요일 선택 바 (월~일) */
    .day-selector {
      display: flex;
      justify-content: space-between;
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 0.8rem;
    }

    .day-btn {
      flex: 1;
      padding: 0.4rem 0;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .day-btn.active {
      background: var(--accent-color);
      color: #0f172a;
      font-weight: 700;
    }

    /* 요일별 요약 디스플레이 */
    .day-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.6rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .day-summary-title {
      font-weight: 700;
      color: var(--accent-color);
    }

    .day-summary-stats {
      color: var(--text-title);
    }

    /* 할 일 입력 폼 (시간 설정 포함) */
    .todo-input-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 1rem;
    }

    .todo-input-row {
      display: flex;
      gap: 8px;
    }

    .todo-input {
      flex: 1;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .todo-input:focus {
      border-color: var(--accent-color);
    }

    .time-input {
      width: 105px;
      padding: 0.65rem 0.5rem;
      border-radius: 10px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      text-align: center;
    }

    .todo-add-btn {
      padding: 0.65rem 1.2rem;
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .todo-add-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    /* 할 일 목록 */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 0.9rem;
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .todo-item:hover {
      background: var(--item-hover);
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .todo-text {
      font-size: 0.9rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .todo-target-time {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
      margin-left: 6px;
      white-space: nowrap;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .todo-item.completed .todo-target-time {
      opacity: 0.5;
    }

    .todo-delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1rem;
      cursor: pointer;
      opacity: 0.6;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .todo-delete-btn:hover {
      opacity: 1;
      background: rgba(239, 68, 68, 0.15);
    }
  </style>
</head>
<body>

  <!-- 테마 토글 버튼 (🌙 다크 / ☀️ 라이트) -->
  <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="테마 변경">🌙</button>

  <!-- 중력 거스르는 입자 애니메이션 캔버스 -->
  <canvas id="gravity-canvas"></canvas>

  <!-- 메인 UI 카드 -->
  <div class="timer-card">
    <h1>Anti-Gravity Study</h1>
    
    <!-- 탭 버튼 (타이머 / 플래너) -->
    <div class="tab-container">
      <button class="tab-btn active" id="tabTimer">⏱️ 타이머</button>
      <button class="tab-btn" id="tabPlanner">📋 주간 플래너</button>
    </div>

    <!-- 1. 타이머 탭 콘텐츠 -->
    <div class="tab-content active" id="contentTimer">
      <div class="total-header">
        <div class="total-time-display" id="totalDisplay">00:00:00</div>
        <div class="total-label">오늘 총 공부 시간</div>
      </div>

      <div class="subject-list" id="subjectList"></div>

      <div class="action-group">
        <button class="btn-add" id="addSubjectBtn">+ 과목 추가</button>
        <button class="btn-reset-all" id="resetAllBtn">전체 리셋</button>
      </div>
    </div>

    <!-- 2. 플래너 탭 콘텐츠 -->
    <div class="tab-content" id="contentPlanner">
      <!-- 요일 선택 바 -->
      <div class="day-selector">
        <button class="day-btn" data-day="월">월</button>
        <button class="day-btn" data-day="화">화</button>
        <button class="day-btn" data-day="수">수</button>
        <button class="day-btn" data-day="목">목</button>
        <button class="day-btn" data-day="금">금</button>
        <button class="day-btn" data-day="토">토</button>
        <button class="day-btn" data-day="일">일</button>
      </div>

      <!-- 선택 요일 목표 요약 -->
      <div class="day-summary">
        <span class="day-summary-title" id="dayTitle">월요일 학습 계획</span>
        <span class="day-summary-stats" id="dayStats">목표: 0시간 0분</span>
      </div>

      <!-- 할 일 및 목표 시간 입력 -->
      <div class="todo-input-container">
        <div class="todo-input-row">
          <input type="text" id="todoInput" class="todo-input" placeholder="학습 할 일 입력..." />
          <input type="number" id="targetMinutesInput" class="time-input" placeholder="목표(분)" min="1" step="5" />
          <button id="addTodoBtn" class="todo-add-btn">추가</button>
        </div>
      </div>

      <div class="todo-list" id="todoList"></div>
    </div>
  </div>

  <script>
    // --- 0. 탭 전환 로직 ---
    const tabTimer = document.getElementById('tabTimer');
    const tabPlanner = document.getElementById('tabPlanner');
    const contentTimer = document.getElementById('contentTimer');
    const contentPlanner = document.getElementById('contentPlanner');

    tabTimer.addEventListener('click', () => {
      tabTimer.classList.add('active');
      tabPlanner.classList.remove('active');
      contentTimer.classList.add('active');
      contentPlanner.classList.remove('active');
    });

    tabPlanner.addEventListener('click', () => {
      tabPlanner.classList.add('active');
      tabTimer.classList.remove('active');
      contentPlanner.classList.add('active');
      contentTimer.classList.remove('active');
    });

    // --- 1. 테마 설정 (다크/라이트) ---
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    themeToggleBtn.textContent = currentTheme === 'dark' ? '🌙' : '☀️';

    themeToggleBtn.addEventListener('click', () => {
      const activeTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      themeToggleBtn.textContent = newTheme === 'dark' ? '🌙' : '☀️';
    });

    // --- 2. 타이머 데이터 및 로직 ---
    const defaultSubjects = [
      { id: 'kor', name: '국어', color: '#f97316', seconds: 0 },
      { id: 'eng', name: '영어', color: '#eab308', seconds: 0 },
      { id: 'math', name: '수학', color: '#3b82f6', seconds: 0 },
      { id: 'sci', name: '과학탐구', color: '#22c55e', seconds: 0 },
      { id: 'soc', name: '사회탐구', color: '#a855f7', seconds: 0 }
    ];

    let subjects = JSON.parse(localStorage.getItem('studySubjects')) || defaultSubjects;
    let activeSubjectId = null;
    let timerInterval = null;

    const subjectListEl = document.getElementById('subjectList');
    const totalDisplayEl = document.getElementById('totalDisplay');
    const addSubjectBtn = document.getElementById('addSubjectBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');

    function saveSubjects() {
      localStorage.setItem('studySubjects', JSON.stringify(subjects));
    }

    function formatTime(sec) {
      const hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const secs = String(sec % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function renderSubjects() {
      subjectListEl.innerHTML = '';
      let totalSec = 0;

      subjects.forEach(sub => {
        totalSec += sub.seconds;

        const item = document.createElement('div');
        item.className = `subject-item ${activeSubjectId === sub.id ? 'active' : ''}`;
        
        item.innerHTML = `
          <div class="subject-info">
            <button class="play-btn" style="background-color: ${sub.color}" onclick="toggleTimer('${sub.id}')">
              ${activeSubjectId === sub.id ? '❚❚' : '▶'}
            </button>
            <span class="subject-name">${sub.name}</span>
          </div>
          <span class="subject-time">${formatTime(sub.seconds)}</span>
        `;
        subjectListEl.appendChild(item);
      });

      totalDisplayEl.textContent = formatTime(totalSec);
    }

    window.toggleTimer = function(id) {
      if (activeSubjectId === id) {
        activeSubjectId = null;
        clearInterval(timerInterval);
      } else {
        clearInterval(timerInterval);
        activeSubjectId = id;

        timerInterval = setInterval(() => {
          const sub = subjects.find(s => s.id === activeSubjectId);
          if (sub) {
            sub.seconds++;
            saveSubjects();
            renderSubjects();
            createParticle();
          }
        }, 1000);
      }
      renderSubjects();
    };

    addSubjectBtn.addEventListener('click', () => {
      const name = prompt('새로 추가할 과목 이름을 입력하세요:');
      if (name && name.trim()) {
        const colors = ['#ec4899', '#14b8a6', '#6366f1', '#f43f5e', '#8b5cf6'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        subjects.push({
          id: 'sub_' + Date.now(),
          name: name.trim(),
          color: randomColor,
          seconds: 0
        });
        saveSubjects();
        renderSubjects();
      }
    });

    resetAllBtn.addEventListener('click', () => {
      if (confirm('모든 과목의 타이머 시간을 리셋하시겠습니까?')) {
        clearInterval(timerInterval);
        activeSubjectId = null;
        subjects.forEach(sub => sub.seconds = 0);
        saveSubjects();
        renderSubjects();
      }
    });

    renderSubjects();

    // --- 3. 요일별 주간 플래너 (To-Do & 시간 관리) 로직 ---
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const todayIndex = new Date().getDay();
    let currentSelectedDay = days[todayIndex]; // 오늘 요일 기본 선택

    let weeklyTodos = JSON.parse(localStorage.getItem('studyWeeklyTodos')) || {
      '월': [{ id: 1, text: '수학 기출 1회풀기', targetMinutes: 60, completed: false }],
      '화': [{ id: 2, text: '영어 단어 암기', targetMinutes: 30, completed: true }],
      '수': [], '목': [], '금': [], '토': [], '일': []
    };

    const dayBtns = document.querySelectorAll('.day-btn');
    const dayTitle = document.getElementById('dayTitle');
    const dayStats = document.getElementById('dayStats');
    const todoInput = document.getElementById('todoInput');
    const targetMinutesInput = document.getElementById('targetMinutesInput');
    const addTodoBtn = document.getElementById('addTodoBtn');
    const todoListEl = document.getElementById('todoList');

    function saveWeeklyTodos() {
      localStorage.setItem('studyWeeklyTodos', JSON.stringify(weeklyTodos));
    }

    function initDaySelector() {
      dayBtns.forEach(btn => {
        const day = btn.getAttribute('data-day');
        if (day === currentSelectedDay) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }

        btn.addEventListener('click', () => {
          dayBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSelectedDay = day;
          renderWeeklyPlanner();
        });
      });
    }

    function renderWeeklyPlanner() {
      dayTitle.textContent = `${currentSelectedDay}요일 학습 계획`;
      
      const dayList = weeklyTodos[currentSelectedDay] || [];
      todoListEl.innerHTML = '';

      let totalMinutes = 0;
      let completedMinutes = 0;

      dayList.forEach(todo => {
        const mins = todo.targetMinutes || 0;
        totalMinutes += mins;
        if (todo.completed) completedMinutes += mins;

        const item = document.createElement('div');
        item.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        
        const timeTag = mins > 0 ? `<span class="todo-target-time">⏱️ ${mins}분</span>` : '';
        
        item.innerHTML = `
          <div class="todo-left">
            <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleWeeklyTodo(${todo.id})">
            <span class="todo-text">${todo.text}</span>
            ${timeTag}
          </div>
          <button class="todo-delete-btn" onclick="deleteWeeklyTodo(${todo.id})">✕</button>
        `;
        todoListEl.appendChild(item);
      });

      const hrs = Math.floor(totalMinutes / 60);
      const remainingMins = totalMinutes % 60;
      const compHrs = Math.floor(completedMinutes / 60);
      const compMins = completedMinutes % 60;

      dayStats.textContent = `목표: ${hrs > 0 ? hrs + '시간 ' : ''}${remainingMins}분 (완료: ${compHrs > 0 ? compHrs + '시간 ' : ''}${compMins}분)`;
    }

    function addWeeklyTodo() {
      const text = todoInput.value.trim();
      const targetMins = parseInt(targetMinutesInput.value) || 0;

      if (text) {
        if (!weeklyTodos[currentSelectedDay]) {
          weeklyTodos[currentSelectedDay] = [];
        }

        weeklyTodos[currentSelectedDay].push({
          id: Date.now(),
          text: text,
          targetMinutes: targetMins,
          completed: false
        });

        todoInput.value = '';
        targetMinutesInput.value = '';
        saveWeeklyTodos();
        renderWeeklyPlanner();
      }
    }

    addTodoBtn.addEventListener('click', addWeeklyTodo);
    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addWeeklyTodo();
    });
    targetMinutesInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addWeeklyTodo();
    });

    window.toggleWeeklyTodo = function(id) {
      const dayList = weeklyTodos[currentSelectedDay] || [];
      const todo = dayList.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        saveWeeklyTodos();
        renderWeeklyPlanner();
      }
    };

    window.deleteWeeklyTodo = function(id) {
      if (weeklyTodos[currentSelectedDay]) {
        weeklyTodos[currentSelectedDay] = weeklyTodos[currentSelectedDay].filter(t => t.id !== id);
        saveWeeklyTodos();
        renderWeeklyPlanner();
      }
    };

    initDaySelector();
    renderWeeklyPlanner();

    // --- 4. 안티그라비티 물리 효과 캔버스 ---
    const canvas = document.getElementById('gravity-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 10;
        this.radius = Math.random() * 4 + 2;
        
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const hue = isDark ? (Math.random() * 60 + 180) : (Math.random() * 50 + 190); 
        const lightness = isDark ? '60%' : '45%';
        
        this.color = `hsl(${hue}, 80%, ${lightness})`;
        this.speedY = -(Math.random() * 2 + 0.5);
        this.speedX = (Math.random() - 0.5) * 1;
        this.opacity = 1;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.opacity -= 0.003;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(this.opacity, 0);
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.closePath();
      }
    }

    function createParticle() {
      for (let i = 0; i < 5; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        
        if (particles[i].opacity <= 0 || particles[i].y < -10) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
